name: Напоминания о тренировке зрения

on:
  schedule:
    # Время в UTC, минуты нарочно «некруглые»: кроны на :00/:30 GitHub в часы пик часто пропускает.
    # На каждый слот два запуска — основной и резервный; от дублей защищает проверка ниже.
    - cron: '7 15 * * *'   # утро (основной):  ~8:07 PDT / 7:07 PST
    - cron: '37 15 * * *'  # утро (резервный)
    - cron: '37 3 * * *'   # вечер (основной): ~20:37 PDT / 19:37 PST
    - cron: '7 4 * * *'    # вечер (резервный)
  workflow_dispatch: {}     # ручной запуск для проверки

permissions:
  actions: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить напоминание в Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Секреты TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID не заданы — пропускаю."
            exit 0
          fi
          H=$(date -u +%H)
          if [ "$H" -ge 10 ]; then SLOT=morning; else SLOT=evening; fi

          # Дедупликация: если сегодня в этом окне уже была успешная отправка по расписанию — выходим.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            TODAY=$(date -u +%Y-%m-%d)
            COUNT=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/reminder.yml/runs?event=schedule&status=success&created=%3E%3D${TODAY}" \
              | jq --arg slot "$SLOT" --arg id "$GITHUB_RUN_ID" \
                '[.workflow_runs[]
                  | select((.id|tostring) != $id)
                  | select(.conclusion == "success")
                  | select((.run_started_at[11:13]|tonumber) as $h
                      | if $slot == "morning" then $h >= 10 else $h < 10 end)
                 ] | length')
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "В этом окне уже отправлено (резервный запуск) — пропускаю."
              exit 0
            fi
          fi

          URL="${PAGE_URL:-https://hannawebb86.github.io/vision-trainer/}"
          if [ "$SLOT" = "evening" ]; then
            TEXT="🌙 Вечернее занятие для глаз (~7 минут): упражнение с таблицей, большие повороты и пальминг перед сном. Открыть тренажер: $URL"
          else
            TEXT="☀️ Доброе утро! Утренний комплекс для глаз (~8 минут): пробуждение глаз, письмо носом, повороты, соляризация и пальминг. Открыть тренажер: $URL"
          fi
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}")
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Отправлено."
          else
            echo "Ошибка Telegram API: $RESP"
            exit 1
          fi
